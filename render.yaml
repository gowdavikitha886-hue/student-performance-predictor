services:
  - type: web
    name: student-performance-predictor
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@spps.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data/spps.db
    disk:
      name: spps-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
